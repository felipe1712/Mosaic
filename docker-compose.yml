services:
  postgres:
    image: postgres:16-alpine
    container_name: mosaic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mosaic}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-mosaic}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mosaic-network

  redis:
    image: redis:7-alpine
    container_name: mosaic_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mosaic-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  mosaic-network:
    driver: bridge
